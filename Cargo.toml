[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
rexc-proto = { path = "crates/rexc-proto" }
rexc-client = { path = "crates/rexc-client" }
rexc-term = { path = "crates/rexc-term" }
rexc-core = { path = "crates/rexc-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
