# Builds the signed arm64 APK. A pushed tag vX.Y.Z publishes it as a GitHub Release;
# a manual run (Actions > Release > Run workflow) only uploads the APK as a run artifact.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK_VERSION: 28.2.13676358
  ZIG_VERSION: 0.17.1
  CARGO_NDK_VERSION: 4.1.2

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version from tag
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "name=ci-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "code=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH (minor and patch below 100)"
            exit 1
          fi
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "code=$(( 10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]} ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          # libghostty-vt-sys keeps its zig caches in Cargo's OUT_DIR, which rust-cache saves.
          use-cache: false

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo-ndk and NDK
        run: |
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Rust engine and Kotlin bindings
        run: scripts/build-android.sh

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Assemble release APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.REXC_KEYSTORE_BASE64 }}
          REXC_KEYSTORE_PASSWORD: ${{ secrets.REXC_KEYSTORE_PASSWORD }}
          # Not a secret: a secret named "rexc" would mask the repo name in every log line.
          REXC_KEY_ALIAS: rexc
          REXC_KEY_PASSWORD: ${{ secrets.REXC_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret REXC_KEYSTORE_BASE64 is missing; refusing to ship a debug-signed APK"
            exit 1
          fi
          export REXC_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$REXC_KEYSTORE"
          ./gradlew :app:assembleRelease \
            -Prexc.versionName="${{ steps.version.outputs.name }}" \
            -Prexc.versionCode="${{ steps.version.outputs.code }}"
          rm -f "$REXC_KEYSTORE"

      - name: Collect APK
        run: |
          mkdir dist
          apk="dist/rexc-${{ steps.version.outputs.name }}-arm64-v8a.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$build_tools/apksigner" verify --print-certs "$apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rexc-${{ steps.version.outputs.name }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made by hand from the tag (or by an earlier attempt) only gets the files.
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "rexc $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
